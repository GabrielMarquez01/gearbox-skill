  <rect x="0" y="0" width="760" height="34" rx="10" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="17" r="6" fill="#febc2e"/>
  <circle cx="62" cy="17" r="6" fill="#28c840"/>
  <text x="380" y="22" font-size="13" fill="#8b949e" text-anchor="middle">claude — Terminal</text>

