<svg width="760" height="340" viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, Menlo, monospace">
  <rect width="760" height="340" rx="10" fill="#0d1117"/>
  <rect x="1" y="1" width="758" height="338" rx="9" fill="none" stroke="#30363d" stroke-width="2"/>
